appId: com.forgelabs.streamer
productName: ForgeOn Streamer

directories:
  output: release

files:
  - dist/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: python/
    to: python/
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!*.pyc"
      - "!*.pyo"
  - from: assets/
    to: assets/
    filter:
      - "**/*"

asar: true

mac:
  target: dmg
  category: public.app-category.utilities
  icon: assets/icon.icns

win:
  target: nsis
  icon: assets/icon.ico

linux:
  target: AppImage
  icon: assets/icon.png

nsis:
  oneClick: true
  perMachine: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
