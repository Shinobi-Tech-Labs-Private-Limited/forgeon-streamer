name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.12'
  PYTHON_STANDALONE_VERSION: '20241219'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            python_arch: aarch64-apple-darwin
          - os: windows-latest
            platform: win
            python_arch: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            python_arch: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python (for pip install)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Download standalone Python runtime
        shell: bash
        run: |
          RELEASE_TAG="${{ env.PYTHON_STANDALONE_VERSION }}"
          ARCH="${{ matrix.python_arch }}"
          FILENAME="cpython-3.12.8+${RELEASE_TAG}-${ARCH}-install_only_stripped.tar.gz"
          URL="https://github.com/indygreg/python-build-standalone/releases/download/${RELEASE_TAG}/${FILENAME}"

          echo "Downloading standalone Python from: ${URL}"
          curl -L -o python-standalone.tar.gz "${URL}" || {
            # Fallback: try without _stripped suffix
            FILENAME="cpython-3.12.8+${RELEASE_TAG}-${ARCH}-install_only.tar.gz"
            URL="https://github.com/indygreg/python-build-standalone/releases/download/${RELEASE_TAG}/${FILENAME}"
            echo "Retrying with: ${URL}"
            curl -L -o python-standalone.tar.gz "${URL}"
          }

          mkdir -p python/runtime
          tar -xzf python-standalone.tar.gz -C python/runtime --strip-components=1
          rm python-standalone.tar.gz

          echo "Bundled Python:"
          if [ "${{ matrix.platform }}" = "win" ]; then
            python/runtime/python.exe --version
          else
            python/runtime/bin/python3 --version
          fi

      - name: Install Python dependencies into bundle
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            python/runtime/python.exe -m pip install --target=python/site-packages -r python/requirements.txt
          else
            python/runtime/bin/python3 -m pip install --target=python/site-packages -r python/requirements.txt
          fi

      - name: Build TypeScript
        run: npm run build

      - name: Build Electron app (macOS)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never

      - name: Build Electron app (Windows)
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish never

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.yml
          draft: false
          prerelease: false
